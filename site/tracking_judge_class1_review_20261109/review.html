<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 1 · Independent Tracking Questions</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f5;color:#183333;font:15px/1.7 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px 20px}h1{line-height:1.3}section{background:white;padding:22px;margin:18px 0;border:1px solid #d8e1e1;border-radius:12px}select{padding:8px;max-width:100%;font:inherit}label{display:inline-block;margin:6px 14px 6px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:8px;border-bottom:1px solid #e3e9e9}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}figure{margin:0}img{width:100%;height:auto;border-radius:6px}figcaption{font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;resize:vertical;background:#f0f4f4;padding:14px;border-radius:8px;font:13px/1.6 monospace}.note{color:#5b7070}.notice{border-left:4px solid #c58a31;padding:10px 16px;background:#fff7e9}.good{color:#167950}.bad{color:#a33d3d}button{cursor:pointer;font:inherit}a{color:#087767}#status{font-weight:600;color:#a33d3d}.language-bar{display:flex;justify-content:flex-end;gap:6px;align-items:center;flex-wrap:wrap}.language-bar button{border:1px solid #ccd9d6;border-radius:7px;padding:6px 13px;background:white;color:#183333}.language-bar button[aria-pressed=true]{background:#183333;color:white;border-color:#183333}.language-bar span{font-size:13px;margin-right:5px}
</style><main>
<nav class="language-bar" aria-label="Language / 语言"><span data-i18n="language">Page language</span><button id="lang-zh" type="button" lang="zh-CN" aria-pressed="false">中文</button><button id="lang-en" type="button" lang="en" aria-pressed="true">English</button></nav>
<h1 data-i18n="heading">Class 1: Independent Tracking Questions</h1>
<p id="status" role="alert" hidden></p>
<section><h2 data-i18n="resultsHeading">全部队列结果</h2><div id="results" class="scroll"></div></section>
<section><h2 data-i18n="questionsHeading">题目与三次原始回答</h2>
<label><span data-i18n="taskLabel">任务</span> <select id="task"><option value="all" data-i18n="all">全部</option><option>STT</option><option>DT</option><option>AT</option></select></label>
<label><span data-i18n="eventLabel">事件</span> <select id="event"></select></label><br>
<label><span data-i18n="effortLabel">推理投入</span> <select id="effort"><option value="low" data-i18n="low">低</option><option value="medium" data-i18n="medium">中</option><option value="high" selected data-i18n="high">高</option></select></label>
<label><span data-i18n="guideLabel">辅助信息</span> <select id="guide"><option value="none" data-i18n="none">无辅助</option><option value="correct" data-i18n="correct">正确引导</option><option value="false" data-i18n="false">错误引导</option><option value="mixed" data-i18n="mixed">半真半假误导</option></select></label>
<label><span data-i18n="modelLabel">模型</span> <select id="model"></select></label>
<div id="images" class="images"></div><h3 data-i18n="inputHeading">完整英文输入</h3><pre id="prompt"></pre>
<details><summary data-i18n="goldHeading">输出字段要求与冻结标准答案（人工审核）</summary><pre id="gold"></pre></details>
<h3 data-i18n="answersHeading">有效回答</h3><div id="answers"></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEXT={
zh:{title:'第一类 · Tracking 独立问答',language:'网页语言',heading:'第一类：Tracking 多条件独立问答',resultsHeading:'全部队列结果',questionsHeading:'题目与三次原始回答',taskLabel:'任务',eventLabel:'事件',effortLabel:'推理投入',guideLabel:'辅助信息',modelLabel:'模型',all:'全部',low:'低（low）',medium:'中（medium）',high:'高（high）',none:'无辅助',correct:'正确引导',false:'错误引导',mixed:'半真半假误导',inputHeading:'完整英文输入',goldHeading:'输出字段要求与冻结标准答案（人工审核）',answersHeading:'有效回答',loadingAnswers:'正在读取原始回答…',loadError:'加载失败，请刷新重试',answerHttp:'回答文件HTTP {status}',modelColumn:'模型／队列',countColumn:'有效答复',accuracyColumn:'整题准确率',completeColumn:'已齐三答条件',reliableColumn:'三答全对',difficulty:'事件难度',easy:'简单',normal:'普通',hard:'困难',identity:'身份与运动判断',temporal:'图片时序排序',reference_frame:'空间参照系',waypoint:'8WP纠错与转换',occlusion:'观测中断后的状态范围',structured:'结构化回答',sorting:'图片选择与排序',waypoint_array:'8WP数组与人物框',attempt:'第{draw}次',right:'评分正确',wrong:'评分错误',complete:'字段完整',invalid:'格式不合规',missing:'此条件快照中已保存{count}份有效回答；待补{missing}份，技术失败不展示为答案。'},
en:{title:'Class 1 · Independent Tracking Questions',language:'Page language',heading:'Class 1: Independent Tracking Questions',resultsHeading:'Results for all model queues',questionsHeading:'Questions and three original responses',taskLabel:'Task',eventLabel:'Event',effortLabel:'Reasoning effort',guideLabel:'Auxiliary guidance',modelLabel:'Model',all:'All',low:'Low',medium:'Medium',high:'High',none:'No guidance',correct:'Correct guidance',false:'Incorrect guidance',mixed:'Partially true, misleading guidance',inputHeading:'Full English input',goldHeading:'Output requirements and frozen gold answer (human review)',answersHeading:'Valid responses',loadingAnswers:'Loading original responses…',loadError:'Loading failed. Refresh to retry.',answerHttp:'Response file HTTP {status}',modelColumn:'Model / queue',countColumn:'Valid responses',accuracyColumn:'Whole-question accuracy',completeColumn:'Conditions with all 3 responses',reliableColumn:'All-three-correct rate',difficulty:'Event difficulty',easy:'Easy',normal:'Normal',hard:'Hard',identity:'Identity and motion',temporal:'Temporal image ordering',reference_frame:'Spatial reference frames',waypoint:'8WP correction and transformation',occlusion:'State bounds after observation loss',structured:'Structured response',sorting:'Image selection and ordering',waypoint_array:'8WP array and target box',attempt:'Response {draw}',right:'Scored correct',wrong:'Scored incorrect',complete:'Required fields present',invalid:'Invalid format',missing:'This snapshot contains {count} valid responses for this condition; {missing} remain. Technical failures are not shown as answers.'}
};
let DATA,CACHE={},version=0,LANG='en';
function t(key,values={}){let text=TEXT[LANG][key]||key;for(const [k,v] of Object.entries(values))text=text.replaceAll('{'+k+'}',String(v));return text}
function initialLanguage(){const query=new URL(location.href).searchParams.get('lang');if(query==='en'||query==='zh')return query;try{const saved=localStorage.getItem('tracking-class1-language');return saved==='zh'?'zh':'en'}catch{return 'en'}}
function displayedModels(){return Object.keys(DATA.summary.models).filter(m=>m!=='deepseek-flash').sort((a,b)=>DATA.summary.models[b].accuracy-DATA.summary.models[a].accuracy)}
function renderResults(){const ms=displayedModels();$('results').innerHTML='<table><thead><tr>'+['modelColumn','countColumn','accuracyColumn','completeColumn','reliableColumn'].map(k=>'<th>'+esc(t(k))+'</th>').join('')+'</tr></thead><tbody>'+ms.map(m=>{const x=DATA.summary.models[m];return '<tr><td>'+esc(m)+'</td><td>'+x.answers+'/1836</td><td>'+(100*x.accuracy).toFixed(2)+'%</td><td>'+x.complete_three_draw_conditions+'/612</td><td>'+(100*x.all_three_correct_rate).toFixed(2)+'%</td></tr>'}).join('')+'</tbody></table>'}
function setLanguage(lang,persist=true){LANG=lang==='en'?'en':'zh';document.documentElement.lang=LANG==='en'?'en':'zh-CN';document.title=t('title');for(const element of document.querySelectorAll('[data-i18n]'))element.textContent=t(element.dataset.i18n);$('lang-zh').setAttribute('aria-pressed',String(LANG==='zh'));$('lang-en').setAttribute('aria-pressed',String(LANG==='en'));if(persist){try{localStorage.setItem('tracking-class1-language',LANG)}catch{}const u=new URL(location.href);u.searchParams.set('lang',LANG);history.replaceState(null,'',u)}if(DATA){renderResults();return render()}return Promise.resolve()}
async function render(){const n=++version,e=DATA.events.find(e=>e.event_id===$('event').value),g=$('guide').value,m=$('model').value;if(!e)return;const q=e.questions[g].question;$('images').innerHTML=q.media.map(i=>'<figure><a target="_blank" rel="noopener" href="'+esc(i.path)+'"><img src="'+esc(i.path)+'" alt="'+esc(i.label)+'"></a><figcaption>'+esc(i.label+' '+i.caption)+'</figcaption></figure>').join('');$('prompt').textContent=q.prompt;$('gold').textContent=JSON.stringify({output_schema:q.output_schema,gold:e.questions[g].gold},null,2);$('answers').textContent=t('loadingAnswers');try{if(!CACHE[m]){const r=await fetch('answers/'+m+'.json');if(!r.ok)throw Error(t('answerHttp',{status:r.status}));CACHE[m]=await r.json()}if(n!==version)return;const a=CACHE[m][e.slots[$('effort').value+'|'+g]]||[];$('answers').innerHTML=a.map(r=>'<article><h4>'+esc(t('attempt',{draw:r.draw}))+' · <span class="'+(r.correct?'good':'bad')+'">'+esc(t(r.correct?'right':'wrong'))+'</span> · '+esc(t(r.format_valid?'complete':'invalid'))+'</h4><pre>'+esc(r.content)+'</pre></article>').join('')+(a.length<3?'<p class="note">'+esc(t('missing',{count:a.length,missing:3-a.length}))+'</p>':'');$('status').hidden=true;$('status').textContent='';window.CLASS1_READY=true;}catch(err){$('answers').textContent=String(err);$('status').hidden=false;$('status').textContent=t('loadError')}}
function events(){const old=$('event').value,es=DATA.events.filter(e=>$('task').value==='all'||e.task===$('task').value);$('event').innerHTML=es.map(e=>'<option>'+esc(e.event_id)+'</option>').join('');if(es.some(e=>e.event_id===old))$('event').value=old;return render()}
$('lang-zh').onclick=()=>setLanguage('zh');$('lang-en').onclick=()=>setLanguage('en');setLanguage(initialLanguage(),false);
fetch('data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{DATA=d;window.CLASS1_DATA=d;const ms=displayedModels();$('model').innerHTML=ms.map(m=>'<option>'+esc(m)+'</option>').join('');renderResults();events();$('task').onchange=events;for(const id of ['event','effort','guide','model'])$(id).onchange=render;}).catch(e=>{$('status').hidden=false;$('status').textContent=t('loadError')+' '+e});
</script></html>
