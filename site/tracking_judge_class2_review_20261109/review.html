<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 2 · Progressive Tracking Conversations</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f5;color:#183333;font:15px/1.7 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px 20px}h1{line-height:1.3}section{background:white;padding:22px;margin:18px 0;border:1px solid #d8e1e1;border-radius:12px}select{padding:8px;max-width:100%;font:inherit}label{display:inline-block;margin:6px 14px 6px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:8px;border-bottom:1px solid #e3e9e9}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}figure{margin:0}img{width:100%;height:auto;border-radius:6px}figcaption{font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;resize:vertical;background:#f0f4f4;padding:14px;border-radius:8px;font:13px/1.6 monospace}.note{color:#5b7070}.notice{border-left:4px solid #c58a31;padding:10px 16px;background:#fff7e9}.good{color:#167950}.bad{color:#a33d3d}button{cursor:pointer;font:inherit}a{color:#087767}#status{font-weight:600;color:#a33d3d}.language-bar{display:flex;justify-content:flex-end;gap:6px;align-items:center;flex-wrap:wrap}.language-bar button{border:1px solid #ccd9d6;border-radius:7px;padding:6px 13px;background:white;color:#183333}.language-bar button[aria-pressed=true]{background:#183333;color:white;border-color:#183333}.language-bar span{font-size:13px;margin-right:5px}

.turn{border-top:1px solid #d8e1e1;margin-top:20px;padding-top:12px}.session{border:1px solid #d8e1e1;border-radius:10px;padding:16px;margin:16px 0}.session h3{margin-top:0}.session h4{margin-bottom:6px}.images{margin:14px 0}details>summary{cursor:pointer}
</style><main>
<nav class="language-bar" aria-label="Language / 语言"><span data-i18n="language">Page language</span><button id="lang-zh" type="button" lang="zh-CN" aria-pressed="false">中文</button><button id="lang-en" type="button" lang="en" aria-pressed="true">English</button></nav>
<h1 data-i18n="heading">Class 2: Progressive Tracking Conversations</h1>
<p id="status" role="alert" hidden></p>
<section><h2 data-i18n="resultsHeading">Model results</h2><div id="results" class="scroll"></div></section>
<section><h2 data-i18n="questionsHeading">Questions and conversations</h2>
<label><span data-i18n="taskLabel">Task</span> <select id="task"><option value="all" data-i18n="all">All</option><option>STT</option><option>DT</option><option>AT</option></select></label>
<label><span data-i18n="eventLabel">Event</span> <select id="event"></select></label><br>
<label><span data-i18n="guide1Label">Turn 1 guidance</span> <select id="guide1"></select></label>
<label><span data-i18n="guide2Label">Turn 2 guidance</span> <select id="guide2"></select></label>
<label><span data-i18n="guide3Label">Turn 3 guidance</span> <select id="guide3"></select></label><br>
<label><span data-i18n="modelLabel">Model</span> <select id="model"></select></label>
<div id="questions"></div>
<h2 data-i18n="answersHeading">Three conversations</h2><div id="answers"></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEXT={
en:{title:'Class 2 · Progressive Tracking Conversations',language:'Page language',heading:'Class 2: Progressive Tracking Conversations',resultsHeading:'Model results',questionsHeading:'Questions and conversations',taskLabel:'Task',eventLabel:'Event',modelLabel:'Model',all:'All',guide1Label:'Turn 1 guidance',guide2Label:'Turn 2 guidance',guide3Label:'Turn 3 guidance',none:'No guidance',correct:'Correct guidance',false:'Incorrect guidance',mixed:'Partially true, misleading guidance',turn:'Turn {turn}',easy:'Easy',normal:'Normal',hard:'Hard',inputHeading:'Full English input',goldHeading:'Output requirements and gold answer',answersHeading:'Three conversations',conversation:'Conversation {draw}',right:'Scored correct',wrong:'Scored incorrect',complete:'Required fields present',invalid:'Invalid format',loadingAnswers:'Loading conversations…',loadError:'Loading failed. Refresh to retry.',missing:'No saved response for this turn.',noSessions:'No saved conversations for this condition.',modelColumn:'Model',sessionsColumn:'Complete conversations',accuracyColumn:'All-turn accuracy',finalColumn:'Final-turn accuracy',jointColumn:'All three turns correct',repeatColumn:'Sequences with all 3 conversations'},
zh:{title:'第二类 · Tracking 连续问答',language:'网页语言',heading:'第二类：Tracking 难度递进连续问答',resultsHeading:'模型结果',questionsHeading:'题目与连续问答',taskLabel:'任务',eventLabel:'事件',modelLabel:'模型',all:'全部',guide1Label:'第一轮辅助',guide2Label:'第二轮辅助',guide3Label:'第三轮辅助',none:'无辅助',correct:'正确引导',false:'错误引导',mixed:'半真半假误导',turn:'第{turn}轮',easy:'简单',normal:'普通',hard:'困难',inputHeading:'完整英文输入',goldHeading:'输出字段要求与标准答案',answersHeading:'三次连续会话',conversation:'第{draw}次会话',right:'评分正确',wrong:'评分错误',complete:'字段完整',invalid:'格式不合规',loadingAnswers:'正在读取连续会话…',loadError:'加载失败，请刷新重试',missing:'该轮暂无已保存回答。',noSessions:'此条件暂无已保存会话。',modelColumn:'模型',sessionsColumn:'完整会话',accuracyColumn:'全部轮次准确率',finalColumn:'末轮准确率',jointColumn:'三轮全对率',repeatColumn:'已齐三次会话的序列'}
};
const LEVELS=['easy','normal','hard'],GUIDES=['none','correct','false','mixed'];
let DATA,CACHE={},LANG='en',version=0;
function t(key,values={}){let text=TEXT[LANG][key]||key;for(const[k,v]of Object.entries(values))text=text.replaceAll('{'+k+'}',String(v));return text}
function initialLanguage(){const q=new URL(location.href).searchParams.get('lang');if(q==='en'||q==='zh')return q;try{return localStorage.getItem('tracking-class2-language')==='zh'?'zh':'en'}catch{return'en'}}
function models(){return Object.keys(DATA.summary.models).filter(m=>m!=='deepseek-flash').sort((a,b)=>(DATA.summary.models[b].final_accuracy??-1)-(DATA.summary.models[a].final_accuracy??-1))}
function percent(x){return x==null?'—':(100*x).toFixed(2)+'%'}
function renderResults(){const fields=['modelColumn','sessionsColumn','accuracyColumn','finalColumn','jointColumn','repeatColumn'];$('results').innerHTML='<table><thead><tr>'+fields.map(k=>'<th>'+esc(t(k))+'</th>').join('')+'</tr></thead><tbody>'+models().map(m=>{const x=DATA.summary.models[m];return'<tr><td>'+esc(m)+'</td><td>'+x.complete_sessions+'/2304</td><td>'+percent(x.accuracy)+'</td><td>'+percent(x.final_accuracy)+'</td><td>'+percent(x.all_turns_correct_rate)+'</td><td>'+x.complete_three_draw_sequences+'/768</td></tr>'}).join('')+'</tbody></table>'}
function setLanguage(lang,persist=true){LANG=lang==='zh'?'zh':'en';document.documentElement.lang=LANG==='zh'?'zh-CN':'en';document.title=t('title');for(const e of document.querySelectorAll('[data-i18n]'))e.textContent=t(e.dataset.i18n);for(const g of['guide1','guide2','guide3']){const old=$(g).value;$(g).innerHTML=GUIDES.map(v=>'<option value="'+v+'">'+esc(t(v))+'</option>').join('');if(GUIDES.includes(old))$(g).value=old}$('lang-zh').setAttribute('aria-pressed',String(LANG==='zh'));$('lang-en').setAttribute('aria-pressed',String(LANG==='en'));if(persist){try{localStorage.setItem('tracking-class2-language',LANG)}catch{}const u=new URL(location.href);u.searchParams.set('lang',LANG);history.replaceState(null,'',u)}if(DATA){renderResults();return render()}return Promise.resolve()}
function selected(){const event=DATA.events.find(e=>e.event_id===$('event').value),guides=['guide1','guide2','guide3'].map(g=>$(g).value);return{event,guides,slot:event.slots[guides.join('|')]}}
async function render(){const n=++version;window.CLASS2_READY=false;const{event,guides,slot}=selected(),model=$('model').value;const questions=LEVELS.map((l,i)=>event.questions[l][guides[i]]);$('questions').innerHTML=questions.map((q,i)=>'<article class="turn"><h3>'+esc(t('turn',{turn:i+1})+' · '+t(LEVELS[i]))+'</h3><div class="images">'+q.media.map(m=>'<figure><a href="'+esc(m.path)+'" target="_blank" rel="noopener"><img src="'+esc(m.path)+'" alt="'+esc(m.label)+'"></a><figcaption>'+esc(m.label+' '+m.caption)+'</figcaption></figure>').join('')+'</div><h4>'+esc(t('inputHeading'))+'</h4><pre class="prompt">'+esc(q.prompt)+'</pre><details><summary>'+esc(t('goldHeading'))+'</summary><pre class="gold">'+esc(JSON.stringify({output_schema:q.output_schema,gold:q.gold},null,2))+'</pre></details></article>').join('');$('answers').textContent=t('loadingAnswers');try{const key=model+'/'+event.event_id;if(!CACHE[key]){const r=await fetch('answers/'+key+'.json');if(!r.ok)throw Error('HTTP '+r.status);CACHE[key]=await r.json()}if(n!==version)return;const sessions=CACHE[key][slot]||[];$('answers').innerHTML=sessions.map(s=>'<article class="session" data-draw="'+s.draw+'"><h3>'+esc(t('conversation',{draw:s.draw}))+'</h3>'+[1,2,3].map(turn=>{const a=s.turns.find(a=>a.turn===turn);return'<div class="response" data-turn="'+turn+'"><h4>'+esc(t('turn',{turn})+' · '+t(LEVELS[turn-1]))+(a?' · <span class="'+(a.correct?'good':'bad')+'">'+esc(t(a.correct?'right':'wrong'))+'</span> · '+esc(t(a.format_valid?'complete':'invalid')):'')+'</h4>'+(a?'<pre>'+esc(a.content)+'</pre>':'<p>'+esc(t('missing'))+'</p>')+'</div>'}).join('')+'</article>').join('')||'<p>'+esc(t('noSessions'))+'</p>';$('status').hidden=true;$('status').textContent='';window.CLASS2_READY=true;}catch(e){$('answers').textContent=t('loadError');$('status').hidden=false;$('status').textContent=t('loadError')+' '+e}}
function events(){const old=$('event').value,es=DATA.events.filter(e=>$('task').value==='all'||e.task===$('task').value);$('event').innerHTML=es.map(e=>'<option>'+esc(e.event_id)+'</option>').join('');if(es.some(e=>e.event_id===old))$('event').value=old;return render()}
$('lang-zh').onclick=()=>setLanguage('zh');$('lang-en').onclick=()=>setLanguage('en');setLanguage(initialLanguage(),false);
fetch('data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{DATA=d;window.CLASS2_DATA=d;$('model').innerHTML=models().map(m=>'<option>'+esc(m)+'</option>').join('');renderResults();events();$('task').onchange=events;for(const id of['event','model','guide1','guide2','guide3'])$(id).onchange=render;}).catch(e=>{$('status').hidden=false;$('status').textContent=t('loadError')+' '+e});
</script></html>
