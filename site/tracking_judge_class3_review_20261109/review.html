<title>Class 3 · Tracking Actions and Recovery</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f5;color:#183333;font:15px/1.7 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px 20px}h1{line-height:1.3}section{background:white;padding:22px;margin:18px 0;border:1px solid #d8e1e1;border-radius:12px}select{padding:8px;max-width:100%;font:inherit}label{display:inline-block;margin:6px 14px 6px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:8px;border-bottom:1px solid #e3e9e9}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}figure{margin:0}img{width:100%;height:auto;border-radius:6px}figcaption{font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;resize:vertical;background:#f0f4f4;padding:14px;border-radius:8px;font:13px/1.6 monospace}.note{color:#5b7070}.notice{border-left:4px solid #c58a31;padding:10px 16px;background:#fff7e9}.good{color:#167950}.bad{color:#a33d3d}button{cursor:pointer;font:inherit}a{color:#087767}#status{font-weight:600;color:#a33d3d}.language-bar{display:flex;justify-content:flex-end;gap:6px;align-items:center;flex-wrap:wrap}.language-bar button{border:1px solid #ccd9d6;border-radius:7px;padding:6px 13px;background:white;color:#183333}.language-bar button[aria-pressed=true]{background:#183333;color:white;border-color:#183333}.language-bar span{font-size:13px;margin-right:5px}

.session{border:1px solid #d8e1e1;border-radius:10px;padding:16px;margin:18px 0}.response{border-top:1px solid #d8e1e1;padding-top:10px;margin-top:14px}.session h3{margin-top:0}details{margin:12px 0}summary{cursor:pointer}.images{margin:14px 0}.response .images{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}#question>h3{margin-bottom:8px}label[hidden]{display:none}
.branch-tools{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.branch-tools button{background:white;border:1px solid #b9cdca;border-radius:6px;padding:5px 10px}.branch-extent{position:relative;margin:auto}.branch-canvas{transform-origin:top left}.branch-map{margin:18px 0 28px}.branch-scroll{overflow:auto;max-height:800px;border:1px solid #d8e1e1;border-radius:10px;background:#f8faf9;padding:16px;overscroll-behavior:contain}.branch-canvas{position:relative;margin:auto}.branch-canvas svg{position:absolute;inset:0;pointer-events:none}.branch-card{position:absolute;width:164px;height:142px;background:white;border:1px solid #b9cdca;border-radius:9px;padding:8px;text-align:center;font:13px/1.35 system-ui,sans-serif;color:#183333;overflow:hidden}.branch-card img{width:146px;height:88px;object-fit:contain;background:#edf2f0;display:block;margin:0 auto 4px}.branch-card strong{display:block}.branch-card.selected{outline:3px solid #087767;outline-offset:2px}.branch-card.success{border:2px solid #22815b}.branch-card.failure{border:2px solid #bb6262}.branch-card .state-caption{font-size:11px;display:block}.branch-map svg text{font:12px system-ui,sans-serif;fill:#183333}.branch-map svg rect{fill:#f8faf9}.branch-map svg path{fill:none;stroke:#a7bfba;stroke-width:2}
</style><main>
<nav class="language-bar" aria-label="Language / 语言"><span data-i18n="language">Page language</span><button id="lang-zh" type="button" lang="zh-CN" aria-pressed="false">中文</button><button id="lang-en" type="button" lang="en" aria-pressed="true">English</button></nav>
<h1 data-i18n="heading">Class 3: Tracking Actions and Recovery</h1><p id="status" role="alert" hidden></p>
<section><h2 data-i18n="resultsHeading">Model results</h2><div id="results" class="scroll"></div></section>
<section><h2 data-i18n="questionsHeading">Questions and responses</h2>
<label><span data-i18n="moduleLabel">Module</span> <select id="module"></select></label>
<label><span data-i18n="modelLabel">Model</span> <select id="model"></select></label><br>
<label><span data-i18n="taskLabel">Task</span> <select id="task"><option value="all" data-i18n="all">All</option><option>STT</option><option>DT</option><option>AT</option></select></label>
<label><span data-i18n="eventLabel">Event</span> <select id="event"></select></label><br>
<label id="difficultyControl"><span data-i18n="difficultyLabel">Option difficulty</span> <select id="difficulty"><option value="easy" data-i18n="easy">Easy</option><option value="normal" data-i18n="normal">Normal</option><option value="hard" data-i18n="hard">Hard</option></select></label>
<label id="stageControl"><span data-i18n="stageLabel">Transition</span> <select id="stage"><option value="1">S0 → S1</option><option value="2">S1 → S2</option></select></label>
<label id="nodeControl" hidden><span data-i18n="nodeLabel">Branch state</span> <select id="node"></select></label>
<div id="question"></div><h2 data-i18n="answersHeading">Three independent repetitions</h2><div id="answers"></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEXT={
en:{title:'Class 3 · Tracking Actions and Recovery',language:'Page language',heading:'Class 3: Tracking Actions and Recovery',resultsHeading:'Model results',questionsHeading:'Questions and responses',moduleLabel:'Module',modelLabel:'Model',taskLabel:'Task',eventLabel:'Event',all:'All',difficultyLabel:'Option difficulty',easy:'Easy',normal:'Normal',hard:'Hard',stageLabel:'Transition',nodeLabel:'Branch state',A:'A · Path selection',B:'B · Action–outcome matching',C:'C · Branch tracking and recovery',root:'Initial state',after_C:'After the reference first action',after_D:'After a recoverable first action',after_CD:'Final recovery decision',observations:'Observations',options:'Waypoint options',resultImages:'Result images',inputHeading:'Full English input',goldHeading:'Output requirements and gold answer',outcomesHeading:'Executed outcomes for all options',answersHeading:'Three independent repetitions',response:'Response {draw}',conversation:'Conversation {draw}',decision:'Decision {turn}',decisionInput:'Input for this decision',right:'Scored correct',wrong:'Scored incorrect',complete:'Required fields present',invalid:'Invalid format',success:'Success',failure:'Failure',pending:'In progress',reference:'Reference action',recoverable:'Recoverable deviation',noAnswers:'No saved responses for this condition.',loading:'Loading responses…',loadError:'Loading failed. Refresh to retry.',modelColumn:'Model',aAnswers:'A responses',aAccuracy:'A accuracy',bAnswers:'B responses',bAccuracy:'B accuracy',cSessions:'C complete conversations',cSuccess:'C success rate',branchHeading:'Full branch logic · answer key',branchState:'State {state}',branchInitial:'Initial observation',branchIntermediate:'Intermediate observation',branchCorrect:'Correct action',branchFlawed:'Flawed action',branchWrong:'Wrong action',branchSelect:'Inspect this state',branchFit:'Fit diagram',branchFull:'Actual size',branchZoom:'Zoom'},
zh:{title:'第三类 · Tracking 动作与恢复',language:'网页语言',heading:'第三类：Tracking 动作理解与恢复',resultsHeading:'模型结果',questionsHeading:'题目与回答',moduleLabel:'模块',modelLabel:'模型',taskLabel:'任务',eventLabel:'事件',all:'全部',difficultyLabel:'选项难度',easy:'简单',normal:'普通',hard:'困难',stageLabel:'状态转换',nodeLabel:'分支状态',A:'A · 路径选择',B:'B · 动作与结果匹配',C:'C · 分支跟踪与恢复',root:'初始状态',after_C:'首次选择参考动作之后',after_D:'首次出现可恢复偏差之后',after_CD:'最后一次恢复决策',observations:'观测画面',options:'路径选项',resultImages:'结果画面',inputHeading:'完整英文输入',goldHeading:'输出字段要求与标准答案',outcomesHeading:'各选项实际执行结果',answersHeading:'三次独立重复',response:'第{draw}次回答',conversation:'第{draw}次会话',decision:'第{turn}次决策',decisionInput:'本次决策的输入',right:'评分正确',wrong:'评分错误',complete:'字段完整',invalid:'格式不合规',success:'成功',failure:'失败',pending:'进行中',reference:'参考动作',recoverable:'可恢复偏差',noAnswers:'此条件暂无已保存回答。',loading:'正在读取回答…',loadError:'加载失败，请刷新重试',modelColumn:'模型',aAnswers:'A 有效回答',aAccuracy:'A 准确率',bAnswers:'B 有效回答',bAccuracy:'B 准确率',cSessions:'C 完整会话',cSuccess:'C 成功率',branchHeading:'完整分支逻辑 · 含标准结果',branchState:'状态 {state}',branchInitial:'初始观测',branchIntermediate:'中间观测',branchCorrect:'正确动作',branchFlawed:'瑕疵动作',branchWrong:'错误动作',branchSelect:'查看此状态',branchFit:'完整显示',branchFull:'原始大小',branchZoom:'缩放'}
};
let DATA,CACHE={},LANG='en',version=0;
function t(key,values={}){let text=TEXT[LANG][key]||key;for(const[k,v]of Object.entries(values))text=text.replaceAll('{'+k+'}',String(v));return text}
function initialLanguage(){const q=new URL(location.href).searchParams.get('lang');if(q==='en'||q==='zh')return q;try{return localStorage.getItem('tracking-class3-language')==='zh'?'zh':'en'}catch{return'en'}}
function percent(x){return x==null?'—':(100*x).toFixed(2)+'%'}
function renderResults(){const fields=['modelColumn','aAnswers','aAccuracy','bAnswers','bAccuracy','cSessions','cSuccess'];$('results').innerHTML='<table><thead><tr>'+fields.map(k=>'<th>'+esc(t(k))+'</th>').join('')+'</tr></thead><tbody>'+Object.entries(DATA.summary.models).map(([m,x])=>'<tr><td>'+esc(m)+'</td><td>'+x.A.answers+'/900</td><td>'+percent(x.A.accuracy)+'</td><td>'+x.B.answers+'/900</td><td>'+percent(x.B.accuracy)+'</td><td>'+x.C.completed+'/297</td><td>'+percent(x.C.accuracy)+'</td></tr>').join('')+'</tbody></table>'}
function setLanguage(lang,persist=true){LANG=lang==='zh'?'zh':'en';document.documentElement.lang=LANG==='zh'?'zh-CN':'en';document.title=t('title');for(const e of document.querySelectorAll('[data-i18n]'))e.textContent=t(e.dataset.i18n);const old=$('module').value;$('module').innerHTML=['A','B','C'].map(v=>'<option value="'+v+'">'+esc(t(v))+'</option>').join('');if(old)$('module').value=old;for(const o of $('node').options)o.textContent=t(o.value);$('lang-zh').setAttribute('aria-pressed',String(LANG==='zh'));$('lang-en').setAttribute('aria-pressed',String(LANG==='en'));if(persist){try{localStorage.setItem('tracking-class3-language',LANG)}catch{}const u=new URL(location.href);u.searchParams.set('lang',LANG);history.replaceState(null,'',u)}if(DATA){renderResults();return render()}return Promise.resolve()}
function current(){return DATA.items.find(i=>i.module===$('module').value&&i.event_id===$('event').value&&(i.module==='C'||i.difficulty===$('difficulty').value&&i.stage===Number($('stage').value)))}
function images(ms){return'<div class="images">'+ms.map(m=>'<figure><a href="'+esc(m.path)+'" target="_blank" rel="noopener"><img src="'+esc(m.path)+'" alt="'+esc(m.label)+'" loading="lazy"></a><figcaption>'+esc(m.label)+'</figcaption></figure>').join('')+'</div>'}
function showQuestion(q,gold,outcomes=[]){const groups={observations:[],options:[],resultImages:[]};for(const m of q.media){const key=/option/i.test(m.label)?'options':/^\d$/.test(m.label)?'resultImages':'observations';groups[key].push(m)}return Object.entries(groups).filter(([k,v])=>v.length).map(([k,v])=>'<h3>'+esc(t(k))+'</h3>'+images(v)).join('')+'<h3>'+esc(t('inputHeading'))+'</h3><pre class="prompt">'+esc(q.prompt)+'</pre><details><summary>'+esc(t('goldHeading'))+'</summary><pre class="gold">'+esc(JSON.stringify({output_schema:q.output_schema,gold},null,2))+'</pre></details>'+(outcomes.length?'<details class="outcomes"><summary>'+esc(t('outcomesHeading'))+'</summary>'+images(outcomes)+'</details>':'')}
function branchTree(item){
 const cards=[],edges=[];let leaf=0;
 function visit(id,depth,path,incoming,ancestors=[]){
  if(ancestors.includes(id))throw Error('C branch cycle');
  const node=item.nodes[id];if(!node)throw Error('C branch missing state');
  const card={id,depth,path,node,terminal:null,incoming,x:0};cards.push(card);
  const children=Object.entries(node.gold).map(([label,edge])=>{
   const nextPath=path?path+' → '+label:label;let child;
   if(edge.terminal){child={depth:depth+1,path:nextPath,terminal:edge.terminal,incoming:node.outcomes.find(m=>m.label===label),x:leaf++*184+82};cards.push(child)}
   else {if(!edge.next_node)throw Error('C branch has no destination');child=visit(edge.next_node,depth+1,nextPath,node.outcomes.find(m=>m.label===label),[...ancestors,id])}
   edges.push({from:card,to:child,label,role:edge.role});return child;
  });
  card.x=(children[0].x+children.at(-1).x)/2;return card;
 }
 visit(item.root_node,0,'',null);
 const width=leaf*184-20,height=(Math.max(...cards.map(c=>c.depth))+1)*226-84;
 const svg='<svg width="'+width+'" height="'+height+'" aria-hidden="true">'+edges.map(e=>{
  const a=e.from,b=e.to,y=a.depth*226+142,end=b.depth*226,mid=y+42;
  const role=t(e.role==='reference'?'branchCorrect':e.role==='recoverable'?'branchFlawed':'branchWrong'),label=e.label+' · '+role;
  return '<path data-from="'+esc(a.id)+'" data-to="'+esc(b.id||b.terminal)+'" data-choice="'+esc(e.label)+'" data-role="'+esc(e.role)+'" d="M '+a.x+' '+y+' V '+mid+' H '+b.x+' V '+end+'"/><rect x="'+(b.x-80)+'" y="'+(end-49)+'" width="160" height="24" rx="5"/><text x="'+b.x+'" y="'+(end-33)+'" text-anchor="middle">'+esc(label)+'</text>';
 }).join('')+'</svg>';
 const boxes=cards.map(c=>{
  const selected=!c.terminal&&c.id===$('node').value,media=c.node?c.node.question.media.find(m=>m.label==='CURRENT'):c.incoming;
  const cls='branch-card'+(c.terminal?' '+c.terminal:'')+(selected?' selected':'');
  const title=c.terminal?t(c.terminal):t('branchState',{state:'S'+c.depth});
  return '<'+(c.terminal?'div':'button type="button" data-branch-state="'+esc(c.id)+'" aria-label="'+esc(t('branchSelect')+' · '+title+' · '+(c.path||t('branchInitial'))) +'" aria-pressed="'+selected+'"')+' class="'+cls+'" style="left:'+(c.x-82)+'px;top:'+(c.depth*226)+'px"'+(c.terminal?' data-branch-terminal="'+esc(c.terminal)+'"':'')+'>'+(media?'<img src="'+esc(media.path)+'" alt="'+esc(c.path||t('branchInitial'))+'" loading="lazy">':'')+'<strong>'+esc(title)+'</strong><span class="state-caption">'+esc(c.path||t('branchInitial'))+'</span></'+(c.terminal?'div':'button')+'>';
 }).join('');
 return '<div class="branch-map"><h3>'+esc(t('branchHeading'))+'</h3><div class="branch-tools"><button type="button" data-branch-fit>'+esc(t('branchFit'))+'</button><button type="button" data-branch-full>'+esc(t('branchFull'))+'</button><label>'+esc(t('branchZoom'))+' <input type="range" min="15" max="100" value="100" aria-label="'+esc(t('branchZoom'))+'" data-branch-zoom></label></div><div class="branch-scroll" tabindex="0"><div class="branch-extent"><div class="branch-canvas" style="width:'+width+'px;height:'+height+'px" data-width="'+width+'" data-height="'+height+'" data-branch-edges="'+edges.length+'">'+svg+boxes+'</div></div></div></div>';
}
function setupBranchTree(){
 const map=$('question').querySelector('.branch-map');if(!map)return;
 const canvas=map.querySelector('.branch-canvas'),extent=map.querySelector('.branch-extent'),scroll=map.querySelector('.branch-scroll'),slider=map.querySelector('[data-branch-zoom]');
 const width=Number(canvas.dataset.width),height=Number(canvas.dataset.height);
 function zoom(scale){canvas.style.transform='scale('+scale+')';extent.style.width=width*scale+'px';extent.style.height=height*scale+'px';slider.value=Math.round(scale*100)}
 function fit(){zoom(Math.min(1,(scroll.clientWidth-34)/width))}
 map.querySelector('[data-branch-fit]').onclick=fit;map.querySelector('[data-branch-full]').onclick=()=>zoom(1);slider.oninput=()=>zoom(Number(slider.value)/100);fit();
}
async function render(){const n=++version;window.CLASS3_READY=false;const item=current();if(!item)return;const isC=item.module==='C';$('difficultyControl').hidden=isC;$('stageControl').hidden=isC;$('nodeControl').hidden=!isC;if(isC){const old=$('node').value;$('node').innerHTML=Object.keys(item.nodes).map(id=>'<option value="'+esc(id)+'">'+esc(t(id))+'</option>').join('');if(item.nodes[old])$('node').value=old;else $('node').value=item.root_node}const node=isC?item.nodes[$('node').value]:item;$('question').innerHTML=(isC?branchTree(item):'')+showQuestion(node.question,node.gold,node.outcomes);for(const button of $('question').querySelectorAll('[data-branch-state]'))button.onclick=()=>{$('node').value=button.dataset.branchState;render()};setupBranchTree();$('answers').textContent=t('loading');try{const key=$('model').value+'.'+item.module;if(!CACHE[key]){const r=await fetch('answers/'+key+'.json');if(!r.ok)throw Error('HTTP '+r.status);CACHE[key]=await r.json()}if(n!==version)return;const sessions=CACHE[key][item.item_id]||[];$('answers').innerHTML=sessions.map(s=>'<article class="session" data-draw="'+s.draw+'"><h3>'+esc(t(isC?'conversation':'response',{draw:s.draw}))+(isC?' · <span class="'+(s.success?'good':s.complete?'bad':'note')+'">'+esc(t(s.complete?s.success?'success':'failure':'pending'))+'</span>':'')+'</h3>'+s.turns.map(a=>'<div class="response" data-turn="'+a.turn+'">'+(isC?'<h4>'+esc(t('decision',{turn:a.turn}))+' · '+esc(t(a.role))+'</h4><details class="decision-input"><summary>'+esc(t('decisionInput'))+'</summary>'+showQuestion(item.nodes[a.node_id].question,item.nodes[a.node_id].gold)+'</details>':'<h4 class="'+(a.correct?'good':'bad')+'">'+esc(t(a.correct?'right':'wrong'))+'</h4>')+'<pre class="answer">'+esc(a.content)+'</pre><p>'+esc(t(a.format_valid?'complete':'invalid'))+'</p></div>').join('')+'</article>').join('')||'<p>'+esc(t('noAnswers'))+'</p>';$('status').hidden=true;$('status').textContent='';window.CLASS3_READY=true;}catch(e){$('answers').textContent=t('loadError');$('status').hidden=false;$('status').textContent=t('loadError')+' '+e}}
function events(){const old=$('event').value,es=[...new Set(DATA.items.filter(i=>i.module===$('module').value&&($('task').value==='all'||i.task===$('task').value)).map(i=>i.event_id))];$('event').innerHTML=es.map(id=>'<option>'+esc(id)+'</option>').join('');if(es.includes(old))$('event').value=old;return render()}
$('lang-zh').onclick=()=>setLanguage('zh');$('lang-en').onclick=()=>setLanguage('en');setLanguage(initialLanguage(),false);
fetch('data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{DATA=d;window.CLASS3_DATA=d;$('model').innerHTML=Object.keys(d.summary.models).filter(m=>m!=='deepseek-flash').map(m=>'<option>'+esc(m)+'</option>').join('');renderResults();const initialModule=new URL(location.href).searchParams.get('module');if(['A','B','C'].includes(initialModule))$('module').value=initialModule;events();$('task').onchange=events;$('module').onchange=events;for(const id of['event','model','difficulty','stage','node'])$(id).onchange=render;}).catch(e=>{$('status').hidden=false;$('status').textContent=t('loadError')+' '+e});
</script></html>
