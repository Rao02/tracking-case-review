<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 3 · Tracking Actions and Recovery</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f5;color:#183333;font:15px/1.7 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px 20px}h1{line-height:1.3}section{background:white;padding:22px;margin:18px 0;border:1px solid #d8e1e1;border-radius:12px}select{padding:8px;max-width:100%;font:inherit}label{display:inline-block;margin:6px 14px 6px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:8px;border-bottom:1px solid #e3e9e9}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}figure{margin:0}img{width:100%;height:auto;border-radius:6px}figcaption{font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;resize:vertical;background:#f0f4f4;padding:14px;border-radius:8px;font:13px/1.6 monospace}.note{color:#5b7070}.notice{border-left:4px solid #c58a31;padding:10px 16px;background:#fff7e9}.good{color:#167950}.bad{color:#a33d3d}button{cursor:pointer;font:inherit}a{color:#087767}#status{font-weight:600;color:#a33d3d}.language-bar{display:flex;justify-content:flex-end;gap:6px;align-items:center;flex-wrap:wrap}.language-bar button{border:1px solid #ccd9d6;border-radius:7px;padding:6px 13px;background:white;color:#183333}.language-bar button[aria-pressed=true]{background:#183333;color:white;border-color:#183333}.language-bar span{font-size:13px;margin-right:5px}

.session{border:1px solid #d8e1e1;border-radius:10px;padding:16px;margin:18px 0}.response{border-top:1px solid #d8e1e1;padding-top:10px;margin-top:14px}.session h3{margin-top:0}details{margin:12px 0}summary{cursor:pointer}.images{margin:14px 0}.response .images{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}#question>h3{margin-bottom:8px}label[hidden]{display:none}
</style><main>
<nav class="language-bar" aria-label="Language / 语言"><span data-i18n="language">Page language</span><button id="lang-zh" type="button" lang="zh-CN" aria-pressed="false">中文</button><button id="lang-en" type="button" lang="en" aria-pressed="true">English</button></nav>
<h1 data-i18n="heading">Class 3: Tracking Actions and Recovery</h1><p id="status" role="alert" hidden></p>
<section><h2 data-i18n="resultsHeading">Model results</h2><div id="results" class="scroll"></div></section>
<section><h2 data-i18n="questionsHeading">Questions and responses</h2>
<label><span data-i18n="moduleLabel">Module</span> <select id="module"></select></label>
<label><span data-i18n="modelLabel">Model</span> <select id="model"></select></label><br>
<label><span data-i18n="taskLabel">Task</span> <select id="task"><option value="all" data-i18n="all">All</option><option>STT</option><option>DT</option><option>AT</option></select></label>
<label><span data-i18n="eventLabel">Event</span> <select id="event"></select></label><br>
<label id="difficultyControl"><span data-i18n="difficultyLabel">Option difficulty</span> <select id="difficulty"><option value="easy" data-i18n="easy">Easy</option><option value="normal" data-i18n="normal">Normal</option><option value="hard" data-i18n="hard">Hard</option></select></label>
<label id="stageControl"><span data-i18n="stageLabel">Transition</span> <select id="stage"><option value="1">S0 → S1</option><option value="2">S1 → S2</option></select></label>
<label id="nodeControl" hidden><span data-i18n="nodeLabel">Branch state</span> <select id="node"></select></label>
<div id="question"></div><h2 data-i18n="answersHeading">Three independent repetitions</h2><div id="answers"></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEXT={
en:{title:'Class 3 · Tracking Actions and Recovery',language:'Page language',heading:'Class 3: Tracking Actions and Recovery',resultsHeading:'Model results',questionsHeading:'Questions and responses',moduleLabel:'Module',modelLabel:'Model',taskLabel:'Task',eventLabel:'Event',all:'All',difficultyLabel:'Option difficulty',easy:'Easy',normal:'Normal',hard:'Hard',stageLabel:'Transition',nodeLabel:'Branch state',A:'A · Path selection',B:'B · Action–outcome matching',C:'C · Branch tracking and recovery',root:'Initial state',after_C:'After the reference first action',after_D:'After a recoverable first action',after_CD:'Final recovery decision',observations:'Observations',options:'Waypoint options',resultImages:'Result images',inputHeading:'Full English input',goldHeading:'Output requirements and gold answer',outcomesHeading:'Executed outcomes for all options',answersHeading:'Three independent repetitions',response:'Response {draw}',conversation:'Conversation {draw}',decision:'Decision {turn}',decisionInput:'Input for this decision',right:'Scored correct',wrong:'Scored incorrect',complete:'Required fields present',invalid:'Invalid format',success:'Success',failure:'Failure',pending:'In progress',reference:'Reference action',recoverable:'Recoverable deviation',noAnswers:'No saved responses for this condition.',loading:'Loading responses…',loadError:'Loading failed. Refresh to retry.',modelColumn:'Model',aAnswers:'A responses',aAccuracy:'A accuracy',bAnswers:'B responses',bAccuracy:'B accuracy',cSessions:'C complete conversations',cSuccess:'C success rate'},
zh:{title:'第三类 · Tracking 动作与恢复',language:'网页语言',heading:'第三类：Tracking 动作理解与恢复',resultsHeading:'模型结果',questionsHeading:'题目与回答',moduleLabel:'模块',modelLabel:'模型',taskLabel:'任务',eventLabel:'事件',all:'全部',difficultyLabel:'选项难度',easy:'简单',normal:'普通',hard:'困难',stageLabel:'状态转换',nodeLabel:'分支状态',A:'A · 路径选择',B:'B · 动作与结果匹配',C:'C · 分支跟踪与恢复',root:'初始状态',after_C:'首次选择参考动作之后',after_D:'首次出现可恢复偏差之后',after_CD:'最后一次恢复决策',observations:'观测画面',options:'路径选项',resultImages:'结果画面',inputHeading:'完整英文输入',goldHeading:'输出字段要求与标准答案',outcomesHeading:'各选项实际执行结果',answersHeading:'三次独立重复',response:'第{draw}次回答',conversation:'第{draw}次会话',decision:'第{turn}次决策',decisionInput:'本次决策的输入',right:'评分正确',wrong:'评分错误',complete:'字段完整',invalid:'格式不合规',success:'成功',failure:'失败',pending:'进行中',reference:'参考动作',recoverable:'可恢复偏差',noAnswers:'此条件暂无已保存回答。',loading:'正在读取回答…',loadError:'加载失败，请刷新重试',modelColumn:'模型',aAnswers:'A 有效回答',aAccuracy:'A 准确率',bAnswers:'B 有效回答',bAccuracy:'B 准确率',cSessions:'C 完整会话',cSuccess:'C 成功率'}
};
let DATA,CACHE={},LANG='en',version=0;
function t(key,values={}){let text=TEXT[LANG][key]||key;for(const[k,v]of Object.entries(values))text=text.replaceAll('{'+k+'}',String(v));return text}
function initialLanguage(){const q=new URL(location.href).searchParams.get('lang');if(q==='en'||q==='zh')return q;try{return localStorage.getItem('tracking-class3-language')==='zh'?'zh':'en'}catch{return'en'}}
function percent(x){return x==null?'—':(100*x).toFixed(2)+'%'}
function renderResults(){const fields=['modelColumn','aAnswers','aAccuracy','bAnswers','bAccuracy','cSessions','cSuccess'];$('results').innerHTML='<table><thead><tr>'+fields.map(k=>'<th>'+esc(t(k))+'</th>').join('')+'</tr></thead><tbody>'+Object.entries(DATA.summary.models).map(([m,x])=>'<tr><td>'+esc(m)+'</td><td>'+x.A.answers+'/900</td><td>'+percent(x.A.accuracy)+'</td><td>'+x.B.answers+'/900</td><td>'+percent(x.B.accuracy)+'</td><td>'+x.C.completed+'/297</td><td>'+percent(x.C.accuracy)+'</td></tr>').join('')+'</tbody></table>'}
function setLanguage(lang,persist=true){LANG=lang==='zh'?'zh':'en';document.documentElement.lang=LANG==='zh'?'zh-CN':'en';document.title=t('title');for(const e of document.querySelectorAll('[data-i18n]'))e.textContent=t(e.dataset.i18n);const old=$('module').value;$('module').innerHTML=['A','B','C'].map(v=>'<option value="'+v+'">'+esc(t(v))+'</option>').join('');if(old)$('module').value=old;for(const o of $('node').options)o.textContent=t(o.value);$('lang-zh').setAttribute('aria-pressed',String(LANG==='zh'));$('lang-en').setAttribute('aria-pressed',String(LANG==='en'));if(persist){try{localStorage.setItem('tracking-class3-language',LANG)}catch{}const u=new URL(location.href);u.searchParams.set('lang',LANG);history.replaceState(null,'',u)}if(DATA){renderResults();return render()}return Promise.resolve()}
function current(){return DATA.items.find(i=>i.module===$('module').value&&i.event_id===$('event').value&&(i.module==='C'||i.difficulty===$('difficulty').value&&i.stage===Number($('stage').value)))}
function images(ms){return'<div class="images">'+ms.map(m=>'<figure><a href="'+esc(m.path)+'" target="_blank" rel="noopener"><img src="'+esc(m.path)+'" alt="'+esc(m.label)+'" loading="lazy"></a><figcaption>'+esc(m.label)+'</figcaption></figure>').join('')+'</div>'}
function showQuestion(q,gold,outcomes=[]){const groups={observations:[],options:[],resultImages:[]};for(const m of q.media){const key=/option/i.test(m.label)?'options':/^\d$/.test(m.label)?'resultImages':'observations';groups[key].push(m)}return Object.entries(groups).filter(([k,v])=>v.length).map(([k,v])=>'<h3>'+esc(t(k))+'</h3>'+images(v)).join('')+'<h3>'+esc(t('inputHeading'))+'</h3><pre class="prompt">'+esc(q.prompt)+'</pre><details><summary>'+esc(t('goldHeading'))+'</summary><pre class="gold">'+esc(JSON.stringify({output_schema:q.output_schema,gold},null,2))+'</pre></details>'+(outcomes.length?'<details class="outcomes"><summary>'+esc(t('outcomesHeading'))+'</summary>'+images(outcomes)+'</details>':'')}
async function render(){const n=++version;window.CLASS3_READY=false;const item=current();if(!item)return;const isC=item.module==='C';$('difficultyControl').hidden=isC;$('stageControl').hidden=isC;$('nodeControl').hidden=!isC;if(isC){const old=$('node').value;$('node').innerHTML=Object.keys(item.nodes).map(id=>'<option value="'+esc(id)+'">'+esc(t(id))+'</option>').join('');if(item.nodes[old])$('node').value=old;else $('node').value=item.root_node}const node=isC?item.nodes[$('node').value]:item;$('question').innerHTML=showQuestion(node.question,node.gold,node.outcomes);$('answers').textContent=t('loading');try{const key=$('model').value+'.'+item.module;if(!CACHE[key]){const r=await fetch('answers/'+key+'.json');if(!r.ok)throw Error('HTTP '+r.status);CACHE[key]=await r.json()}if(n!==version)return;const sessions=CACHE[key][item.item_id]||[];$('answers').innerHTML=sessions.map(s=>'<article class="session" data-draw="'+s.draw+'"><h3>'+esc(t(isC?'conversation':'response',{draw:s.draw}))+(isC?' · <span class="'+(s.success?'good':s.complete?'bad':'note')+'">'+esc(t(s.complete?s.success?'success':'failure':'pending'))+'</span>':'')+'</h3>'+s.turns.map(a=>'<div class="response" data-turn="'+a.turn+'">'+(isC?'<h4>'+esc(t('decision',{turn:a.turn}))+' · '+esc(t(a.role))+'</h4><details class="decision-input"><summary>'+esc(t('decisionInput'))+'</summary>'+showQuestion(item.nodes[a.node_id].question,item.nodes[a.node_id].gold)+'</details>':'<h4 class="'+(a.correct?'good':'bad')+'">'+esc(t(a.correct?'right':'wrong'))+'</h4>')+'<pre class="answer">'+esc(a.content)+'</pre><p>'+esc(t(a.format_valid?'complete':'invalid'))+'</p></div>').join('')+'</article>').join('')||'<p>'+esc(t('noAnswers'))+'</p>';$('status').hidden=true;$('status').textContent='';window.CLASS3_READY=true;}catch(e){$('answers').textContent=t('loadError');$('status').hidden=false;$('status').textContent=t('loadError')+' '+e}}
function events(){const old=$('event').value,es=[...new Set(DATA.items.filter(i=>i.module===$('module').value&&($('task').value==='all'||i.task===$('task').value)).map(i=>i.event_id))];$('event').innerHTML=es.map(id=>'<option>'+esc(id)+'</option>').join('');if(es.includes(old))$('event').value=old;return render()}
$('lang-zh').onclick=()=>setLanguage('zh');$('lang-en').onclick=()=>setLanguage('en');setLanguage(initialLanguage(),false);
fetch('data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{DATA=d;window.CLASS3_DATA=d;$('model').innerHTML=Object.keys(d.summary.models).filter(m=>m!=='deepseek-flash').map(m=>'<option>'+esc(m)+'</option>').join('');renderResults();events();$('task').onchange=events;$('module').onchange=events;for(const id of['event','model','difficulty','stage','node'])$(id).onchange=render;}).catch(e=>{$('status').hidden=false;$('status').textContent=t('loadError')+' '+e});
</script></html>
