<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C · Information-condition controls</title>
<link rel="stylesheet" href="review_media.css"><script defer src="review_media.js"></script><style>body{font:16px/1.55 system-ui;margin:24px auto;max-width:1120px;padding:0 16px;color:#183035;background:#f8faf9}button,select{font:inherit;padding:7px}nav,.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center}section,article{background:white;border:1px solid #d7e1df;border-radius:12px;padding:18px;margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:560px;overflow:auto;background:#f3f6f5;padding:14px;border-radius:6px}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}img{width:100%;max-height:420px;object-fit:contain}figure{margin:0}table{border-collapse:collapse;font-size:14px}td,th{padding:7px 10px;border-bottom:1px solid #ddd;text-align:left}.table-scroll{overflow:auto}h1{font-size:26px}.good{color:#1b785a}.bad{color:#b4453f}</style>
<nav><a href="review.html" id="back">← Action and recovery review</a><button id="en">English</button><button id="zh">中文</button></nav><h1 id="heading">C · Information-condition controls</h1>
<div class="batch-tabs" aria-label="Experiment batch"><button id="batchAll" data-batch="all">All models</button><button id="batch1" data-batch="1">Batch 1</button><button id="batch2" data-batch="2">Batch 2</button></div><p id="batchInfo" class="batch-info"></p>
<div class="filters"><label><span id="taskLabel">Task</span> <select id="task"><option>All</option><option>STT</option><option>DT</option><option>AT</option></select></label><label><span id="eventLabel">Case</span> <select id="event"></select></label><label><span id="nodeLabel">State</span> <select id="node"><option value="root">root</option><option value="after_D">after_D</option></select></label><label><span id="conditionLabel">Information</span> <select id="condition"><option>BASE</option><option value="OUTIMG">OUT-IMG</option><option value="OUTTXT">OUT-TXT</option><option>NOIMG</option></select></label><label><span id="modelLabel">Model</span> <select id="model"></select></label></div>
<section><div class="table-scroll" id="results"></div></section><section><h2 id="inputLabel">English input</h2><div id="images" class="images"></div><pre id="prompt"></pre><details><summary id="goldLabel">Output requirements and gold answer</summary><pre id="gold"></pre></details></section><article><h2 id="answerLabel">Response</h2><div id="verdict"></div><pre id="answer"></pre></article><p id="status"></p>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let DATA,CACHE={},LANG='en',revision=0;const BATCHES={'1':['gpt-6.1-sol','gpt-6.1-terra','claude-sonnet-5-5','deepseek-v4.1-flash'],'2':['kimi-k3.1-pro','gemini-4-argon','grok-4.7','glm-5.3-flash']};let BATCH=new URL(location.href).searchParams.get('batch')||'all';if(!BATCHES[BATCH])BATCH='all';
const TEXT={en:{"batchAll":"All models","batch1":"Batch 1 · Sol / Terra / Sonnet / DPSK","batch2":"Batch 2 · Kimi / Gemini / Grok / GLM","batchDescription":"99 cases × 2 states × 4 information conditions = 792 records per model: 693 new independent responses + 99 reused root BASE responses. Each condition has one response.",back:'← Action and recovery review',heading:'C · Information-condition controls',taskLabel:'Task',eventLabel:'Case',nodeLabel:'State',conditionLabel:'Information',modelLabel:'Model',inputLabel:'English input',goldLabel:'Output requirements and gold answer',answerLabel:'One response per information condition',model:'Model',coverage:'Coverage',good:'Reference action',coarse:'Avoid failure',fine:'Reference among non-failures',defect:'Recoverable deviation',fail:'Failure',invalid:'Invalid choice',root:'Initial state',after_D:'After a recoverable first action',reuse:'Existing first turn reused',fresh:'Independent request',right:'Reference action selected',wrong:'Other / invalid choice'},zh:{"batchAll":"全部模型","batch1":"第一批 · Sol / Terra / Sonnet / DPSK","batch2":"第二批 · Kimi / Gemini / Grok / GLM","batchDescription":"99案例 × 2个节点 × 4种信息条件＝每模型792条记录：693份新独立回答＋99份复用root BASE。每个条件一份回答。",back:'← 返回动作与恢复题目',heading:'C · 信息条件对照实验',taskLabel:'任务',eventLabel:'案例',nodeLabel:'状态',conditionLabel:'信息条件',modelLabel:'模型',inputLabel:'英文输入',goldLabel:'输出要求与标准答案',answerLabel:'每个信息条件一份回答',model:'模型',coverage:'完成数',good:'参考动作率',coarse:'避开失败率',fine:'未选失败中的参考动作率',defect:'可恢复偏差',fail:'失败选项',invalid:'无效选择',root:'初始状态',after_D:'首次选择瑕疵之后',reuse:'复用已有第一轮回答',fresh:'独立请求',right:'选择参考动作',wrong:'选择其他或无效选项'}};
function t(k){return TEXT[LANG][k]||k}function pct(a,b){return b?(100*a/b).toFixed(2)+'%':'—'}
async function setLanguage(lang){LANG=lang;document.documentElement.lang=lang==='zh'?'zh-CN':'en';for(const k of Object.keys(TEXT.en))if($(k)&&$(k).tagName!=='SELECT')$(k).textContent=t(k);for(const o of $('node').options)o.textContent=t(o.value);if(DATA)updateBatchControls();return render()}
function batchModels(){return BATCHES[BATCH]||Object.keys(DATA.summary)}
function updateBatchControls(){const old=$('model').value,models=batchModels();$('model').innerHTML=models.map(m=>'<option>'+esc(m)+'</option>').join('');if(models.includes(old))$('model').value=old;for(const b of document.querySelectorAll('[data-batch]'))b.setAttribute('aria-pressed',String(b.dataset.batch===BATCH));$('batchInfo').textContent=t('batchDescription')}
function setBatch(value){BATCH=BATCHES[value]?value:'all';updateBatchControls();const u=new URL(location.href);if(BATCH==='all')u.searchParams.delete('batch');else u.searchParams.set('batch',BATCH);history.replaceState(null,'',u);return render()}
function selected(){return DATA.items.find(i=>i.event_id===$('event').value&&i.node===$('node').value&&i.condition===$('condition').value)}
function events(){const old=$('event').value,ids=[...new Set(DATA.items.filter(i=>$('task').value==='All'||i.task===$('task').value).map(i=>i.event_id))];$('event').innerHTML=ids.map(i=>'<option>'+esc(i)+'</option>').join('');if(ids.includes(old))$('event').value=old;return render()}
async function render(){if(!DATA)return;const token=++revision,q=selected();if(!q)throw Error('missing information condition');$('prompt').textContent=q.question.prompt;$('gold').textContent=JSON.stringify({output_schema:q.question.output_schema,gold:q.gold},null,2);$('images').innerHTML=q.question.media.map(m=>'<figure><a target="_blank" href="'+esc(m.path)+'"><img src="'+esc(m.path)+'" alt="'+esc(m.label)+'"></a><figcaption>'+esc(m.label)+'</figcaption></figure>').join('');const field=$('node').value+'|'+$('condition').value;$('results').innerHTML='<table><thead><tr>'+['model','coverage','good','coarse','fine'].map(k=>'<th>'+t(k)+'</th>').join('')+'</tr></thead><tbody>'+Object.entries(DATA.summary).filter(([m])=>batchModels().includes(m)).map(([m,ss])=>{const s=ss[field];return'<tr><td>'+esc(m)+'</td><td>'+s.n+'/99</td><td>'+pct(s.good,s.n)+'</td><td>'+pct(s.coarse,s.n)+'</td><td>'+pct(s.good,s.coarse)+'</td></tr>'}).join('')+'</tbody></table>';const m=$('model').value;if(!CACHE[m]){const r=await fetch('answers/'+m+'.INFO.json');if(!r.ok)throw Error('HTTP '+r.status);CACHE[m]=await r.json()}if(token!==revision)return;const a=CACHE[m][q.key];if(!a||!a.content.trim())throw Error('missing response');$('answer').textContent=a.content;$('verdict').textContent=t(a.correct?'right':'wrong')+' · '+t(a.reused?'reuse':'fresh');$('verdict').className=a.correct?'good':'bad';$('status').textContent='';window.INFO_READY=true}
fetch('info_data.json').then(r=>r.json()).then(d=>{DATA=d;window.INFO_DATA=d;updateBatchControls();for(const button of document.querySelectorAll('[data-batch]'))button.onclick=()=>setBatch(button.dataset.batch);$('task').onchange=events;for(const id of ['event','node','condition','model'])$(id).onchange=render;$('en').onclick=()=>setLanguage('en');$('zh').onclick=()=>setLanguage('zh');events()}).catch(e=>$('status').textContent=String(e));
</script></html>
